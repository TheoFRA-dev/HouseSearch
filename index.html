<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hairpoucepouce Immo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Hairpoucepouce Immo</h1>
    </header>

    <main class="main">
      <aside class="sidebar">
        <form id="searchForm" class="filters">
          <div class="filter-group">
            <label>Départements</label>
            <div id="departmentsList" class="checkboxes"></div>
          </div>

          <div class="filter-group">
            <label>Prix (€)</label>
            <div class="price-inputs">
              <input id="minPrice" name="minPrice" type="number" placeholder="Min" />
              <input id="maxPrice" name="maxPrice" type="number" placeholder="Max" />
            </div>
          </div>

          <div class="filter-group">
            <label>Localisation</label>
            <input id="location" name="location" type="text" placeholder="Ex: Paris, Lyon..." />
            <span class="help-text">Distance à partir de cet endroit</span>
          </div>

          <button class="btn-search" type="submit">Rechercher</button>
          <button class="btn-reset" type="button" id="resetBtn">Réinitialiser</button>
        </form>
      </aside>

      <section class="results-section">
        <div class="results-header">
          <h2 id="resultTitle">Résultats</h2>
          <p id="resultCount">0 bien(s) trouvé(s)</p>
        </div>

        <div id="resultsGrid" class="results-grid"></div>

        <div class="pagination" id="pagination"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
